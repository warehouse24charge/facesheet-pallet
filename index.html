<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบปะหน้า 8 ช่อง A4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Prompt:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: แผงตั้งค่าด้านซ้าย + พรีวิว A4 ด้านขวา (พิมพ์เฉพาะกระดาษ) */
:root{
  --bg:#e5e8e6; --panel:#ffffff; --ink:#17231d; --muted:#5b6861; --line:#cdd5d0;
  --ui:#17231d; --ui-ink:#ffffff;
  --accent:#1e7a4c; --head-ink:#ffffff;
  --font:'Prompt','Sarabun',sans-serif;
  --vs:20pt; --ls:9pt; --ts:13pt; --bw:0.35mm; --m:5mm;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Sarabun',system-ui,sans-serif}
.app{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;padding:16px;align-items:start}
.panel{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
.panel h1{margin:0;font:700 18px/1.2 'Prompt','Sarabun',sans-serif}
.panel h2{margin:0 0 8px;font:600 12px/1 'Prompt','Sarabun',sans-serif;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.group{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.f{display:grid;gap:4px}
.f > span, .chk{font-size:13px}
.f .val{color:var(--muted);font-variant-numeric:tabular-nums}
.f .top{display:flex;justify-content:space-between;gap:8px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ui)}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);background:#fff;padding:2px}
select{width:100%;height:34px;border:1px solid var(--line);background:#fff;font:inherit;padding:0 8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:600 13px/1 'Sarabun',sans-serif;height:36px;border:1px solid var(--ui);background:#fff;color:var(--ui);cursor:pointer;padding:0 10px}
button:hover{background:#eef2f0}
button.primary{background:var(--ui);color:var(--ui-ink);height:44px;font-size:15px}
button.primary:hover{background:#0c150f}
button.wide{grid-column:1/-1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2d6cdf;outline-offset:2px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.hint b{color:var(--ink)}

.stage{min-width:0}
.scalebox{margin:0 auto}
.sheet{width:210mm;height:297mm;background:#fff;box-shadow:0 2px 18px rgba(20,35,28,.18);padding:var(--m);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);transform-origin:top left;font-family:var(--font)}
.cell{padding:3mm;display:flex;min-width:0;min-height:0}
.cell.off{opacity:.25;pointer-events:none}
.sheet.cut .cell{border-right:.2mm dashed #8a9791;border-bottom:.2mm dashed #8a9791}
.sheet.cut .cell:nth-child(odd){border-left:.2mm dashed #8a9791}
.sheet.cut .cell:nth-child(-n+2){border-top:.2mm dashed #8a9791}

.card{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border:var(--bw) solid var(--accent);overflow:hidden}
.head{background:var(--accent);color:var(--head-ink);padding:2mm 4mm;font-weight:600;font-size:var(--ts);letter-spacing:.02em;line-height:1.25}
.rows{flex:1;display:flex;flex-direction:column;min-height:0}
.row{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.4mm;padding:0 4mm;border-top:.2mm solid #d3dad6;min-height:0;min-width:0}
.row:first-child{border-top:0}
.lab{font-size:var(--ls);color:#53615a;line-height:1.2}
.val{font-size:var(--vs);font-weight:600;line-height:1.15;overflow-wrap:anywhere;color:#10201a}
.note{padding:1.5mm 4mm;border-top:.2mm solid #d3dad6;font-size:var(--ls);line-height:1.3;color:#10201a}
.card.center .row,.card.center .head,.card.center .note{text-align:center}

.ed{outline:none;cursor:text;min-width:1ch}
.ed:hover{outline:1px dashed rgba(45,108,223,.55);outline-offset:1px}
.ed:focus{outline:2px solid #2d6cdf;outline-offset:1px;background:rgba(45,108,223,.08)}
.ed:empty::before{content:attr(data-ph);color:#9aa6a0;font-weight:400}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding:12px}
  .panel{position:static;max-height:none}
}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff}
  .app{display:block;padding:0}
  .panel{display:none}
  .scalebox{width:auto!important;height:auto!important;margin:0}
  .sheet{transform:none!important;box-shadow:none;margin:0}
  .cell.off{visibility:hidden;opacity:1}
  .ed:hover,.ed:focus{outline:none!important;background:none!important}
  .ed:empty::before{content:none}
  .note:empty{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" aria-label="ตั้งค่า">
    <div>
      <h1>ใบปะหน้า 8 ช่อง A4</h1>
      <p class="hint">คลิกที่ข้อความบนกระดาษเพื่อแก้ไขได้ทันที</p>
    </div>
    <button class="primary" id="print" type="button">พิมพ์ใบปะหน้า</button>
    <p class="hint">ตั้งค่าตอนพิมพ์: ขนาด <b>A4</b>, สเกล <b>100%</b> (Actual size), ปิด <b>Headers and footers</b></p>

    <div class="group">
      <h2>เนื้อหา</h2>
      <label class="chk"><input type="checkbox" id="sync"> แก้ช่องเดียว ทุกช่องเปลี่ยนตาม</label>
      <div class="btns">
        <button type="button" id="addRow">+ เพิ่มแถว</button>
        <button type="button" id="delRow">− ลบแถว</button>
        <button type="button" id="copy1" class="wide">คัดลอกช่องที่ 1 ไปทุกช่อง</button>
      </div>
      <label class="f"><span>จำนวนช่องที่พิมพ์</span>
        <select id="count"></select>
      </label>
    </div>

    <div class="group">
      <h2>สไตล์</h2>
      <label class="f"><span>สีหลัก</span><input type="color" id="accent"></label>
      <label class="chk"><input type="checkbox" id="head"> แสดงแถบหัวบัตร</label>
      <label class="f"><span>ฟอนต์</span>
        <select id="font"><option>Prompt</option><option>Sarabun</option><option>Kanit</option></select>
      </label>
      <label class="f"><span>การจัดวาง</span>
        <select id="align"><option value="left">ชิดซ้าย</option><option value="center">กึ่งกลาง</option></select>
      </label>
      <label class="f"><span class="top"><span>ขนาดตัวอักษรข้อมูล</span><span class="val" id="vs-o"></span></span><input type="range" id="vs" min="12" max="40" step="1"></label>
      <label class="f"><span class="top"><span>ขนาดตัวอักษรหัวข้อ</span><span class="val" id="ls-o"></span></span><input type="range" id="ls" min="7" max="16" step="0.5"></label>
      <label class="f"><span class="top"><span>ขนาดตัวอักษรแถบหัว</span><span class="val" id="ts-o"></span></span><input type="range" id="ts" min="9" max="24" step="0.5"></label>
      <label class="f"><span class="top"><span>ความหนาเส้นขอบ</span><span class="val" id="bw-o"></span></span><input type="range" id="bw" min="0" max="1.5" step="0.05"></label>
    </div>

    <div class="group">
      <h2>กระดาษ</h2>
      <label class="chk"><input type="checkbox" id="cut"> แสดงเส้นประสำหรับตัด</label>
      <label class="f"><span class="top"><span>ขอบกระดาษ</span><span class="val" id="margin-o"></span></span><input type="range" id="margin" min="0" max="15" step="0.5"></label>
      <button type="button" id="reset">คืนค่าเริ่มต้น</button>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="scalebox" id="scalebox"><div class="sheet" id="sheet"></div></div>
  </main>
</div>

<script>
(function(){
  var KEY='cover-sheet-8up-v1';
  var DEF={sync:true,count:8,accent:'#1e7a4c',head:true,font:'Prompt',vs:20,ls:9,ts:13,bw:0.35,margin:5,cut:true,align:'left'};
  function defCard(){return {title:'ใบปะหน้าสินค้า',rows:[['ประเภท','STAND'],['รหัสสินค้า','BASE-GRN-90CM'],['ล็อต','LOT141026-01']],note:''};}
  function fresh(){var c=[];for(var i=0;i<8;i++)c.push(defCard());return {s:Object.assign({},DEF),cards:c};}

  var state=fresh();
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var p=JSON.parse(raw);if(p&&p.cards&&p.cards.length===8){state.s=Object.assign({},DEF,p.s);state.cards=p.cards;}}
  }catch(e){}

  var $=function(id){return document.getElementById(id)};
  var sheet=$('sheet'),stage=$('stage'),box=$('scalebox'),root=document.documentElement;
  var timer;
  function save(){clearTimeout(timer);timer=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}},250);}

  function inkFor(hex){
    var h=hex.replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');
    var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    return (0.299*r+0.587*g+0.114*b)>170?'#10201a':'#ffffff';
  }

  function applyStyle(){
    var s=state.s;
    root.style.setProperty('--accent',s.accent);
    root.style.setProperty('--head-ink',inkFor(s.accent));
    root.style.setProperty('--font',"'"+s.font+"','Sarabun',sans-serif");
    root.style.setProperty('--vs',s.vs+'pt');
    root.style.setProperty('--ls',s.ls+'pt');
    root.style.setProperty('--ts',s.ts+'pt');
    root.style.setProperty('--bw',s.bw+'mm');
    root.style.setProperty('--m',s.margin+'mm');
    sheet.classList.toggle('cut',!!s.cut);
    var cells=sheet.querySelectorAll('.cell');
    for(var i=0;i<cells.length;i++){cells[i].classList.toggle('off',i>=s.count);}
    var cards=sheet.querySelectorAll('.card');
    for(var j=0;j<cards.length;j++){cards[j].classList.toggle('center',s.align==='center');}
    $('vs-o').textContent=s.vs+' pt';$('ls-o').textContent=s.ls+' pt';$('ts-o').textContent=s.ts+' pt';
    $('bw-o').textContent=s.bw+' มม.';$('margin-o').textContent=s.margin+' มม.';
  }

  function ed(cls,f,text,r,ph){
    var d=document.createElement('div');
    d.className='ed '+cls;d.setAttribute('contenteditable','true');d.setAttribute('spellcheck','false');
    d.dataset.f=f;if(r!==undefined)d.dataset.r=r;if(ph)d.dataset.ph=ph;
    d.textContent=text;return d;
  }

  function render(){
    sheet.textContent='';
    state.cards.forEach(function(c,i){
      var cell=document.createElement('div');cell.className='cell';cell.dataset.i=i;
      var card=document.createElement('article');card.className='card';
      if(state.s.head){
        var h=ed('head','title',c.title,undefined,'หัวบัตร');card.appendChild(h);
      }
      var rows=document.createElement('div');rows.className='rows';
      c.rows.forEach(function(r,k){
        var row=document.createElement('div');row.className='row';
        row.appendChild(ed('lab','l',r[0],k,'หัวข้อ'));
        row.appendChild(ed('val','v',r[1],k,'ข้อมูล'));
        rows.appendChild(row);
      });
      card.appendChild(rows);
      card.appendChild(ed('note','note',c.note,undefined,'หมายเหตุ'));
      cell.appendChild(card);sheet.appendChild(cell);
    });
    applyStyle();fit();
  }

  function setField(i,f,r,txt){
    var c=state.cards[i];
    if(f==='title')c.title=txt;
    else if(f==='note')c.note=txt;
    else if(c.rows[r]){c.rows[r][f==='l'?0:1]=txt;}
  }

  sheet.addEventListener('input',function(e){
    var el=e.target.closest('.ed');if(!el)return;
    var i=+el.closest('.cell').dataset.i,f=el.dataset.f,r=el.dataset.r,txt=el.textContent;
    setField(i,f,r,txt);
    if(state.s.sync){
      var cells=sheet.querySelectorAll('.cell');
      for(var j=0;j<cells.length;j++){
        if(j===i)continue;
        var sel='.ed[data-f="'+f+'"]'+(r!==undefined?'[data-r="'+r+'"]':'');
        var t=cells[j].querySelector(sel);
        if(t){t.textContent=txt;setField(j,f,r,txt);}
      }
    }
    save();
  });
  sheet.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();e.target.blur();}
  });
  sheet.addEventListener('paste',function(e){
    if(!e.target.closest('.ed'))return;
    e.preventDefault();
    var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s*[\r\n]+\s*/g,' ');
    document.execCommand('insertText',false,t);
  });

  /* แผงตั้งค่า */
  var cs=$('count');
  for(var n=1;n<=8;n++){var o=document.createElement('option');o.value=n;o.textContent=n+' ช่อง';cs.appendChild(o);}
  var bindings=[['sync','sync','check'],['count','count','num'],['accent','accent','str'],['head','head','check'],['font','font','str'],['align','align','str'],['vs','vs','num'],['ls','ls','num'],['ts','ts','num'],['bw','bw','num'],['cut','cut','check'],['margin','margin','num']];
  var needsRender={head:1};
  function syncInputs(){
    bindings.forEach(function(b){
      var el=$(b[0]),v=state.s[b[1]];
      if(b[2]==='check')el.checked=!!v;else el.value=v;
    });
  }
  bindings.forEach(function(b){
    var el=$(b[0]);
    el.addEventListener('input',function(){
      var v=b[2]==='check'?el.checked:(b[2]==='num'?parseFloat(el.value):el.value);
      state.s[b[1]]=v;
      if(needsRender[b[1]])render();else applyStyle();
      save();
    });
  });

  $('addRow').addEventListener('click',function(){
    if(state.cards[0].rows.length>=8)return;
    state.cards.forEach(function(c){c.rows.push(['หัวข้อ','ข้อมูล']);});
    render();save();
  });
  $('delRow').addEventListener('click',function(){
    if(state.cards[0].rows.length<=1)return;
    state.cards.forEach(function(c){c.rows.pop();});
    render();save();
  });
  $('copy1').addEventListener('click',function(){
    var src=JSON.stringify(state.cards[0]);
    state.cards=state.cards.map(function(){return JSON.parse(src);});
    render();save();
  });
  var armed=false,armTimer;
  $('reset').addEventListener('click',function(){
    var b=$('reset');
    if(!armed){armed=true;b.textContent='กดอีกครั้งเพื่อยืนยัน';armTimer=setTimeout(function(){armed=false;b.textContent='คืนค่าเริ่มต้น';},3000);return;}
    clearTimeout(armTimer);armed=false;b.textContent='คืนค่าเริ่มต้น';
    state=fresh();syncInputs();render();save();
  });
  $('print').addEventListener('click',function(){window.print();});

  /* ย่อพรีวิวให้พอดีหน้าจอ */
  function fit(){
    var pxW=210*96/25.4,pxH=297*96/25.4;
    var s=Math.min(1,stage.clientWidth/pxW);
    sheet.style.transform='scale('+s+')';
    box.style.width=(pxW*s)+'px';box.style.height=(pxH*s)+'px';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('beforeprint',function(){sheet.style.transform='none';});
  window.addEventListener('afterprint',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}

  syncInputs();render();
})();
</script>
</body>
</html>
